name: API Regression Tests

on:
  schedule:
    # 9:00 AM IST (Mon-Fri) — IST = UTC+5:30, so 03:30 UTC
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

jobs:
  test:
    name: Run API regression suite
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API regression tests
        env:
          USER_ADMIN_PASSWORD: ${{ secrets.USER_ADMIN_PASSWORD }}
          USER_DOCTOR_PASSWORD: ${{ secrets.USER_DOCTOR_PASSWORD }}
          USER_NURSE_PASSWORD: ${{ secrets.USER_NURSE_PASSWORD }}
          USER_RECEPTIONIST_PASSWORD: ${{ secrets.USER_RECEPTIONIST_PASSWORD }}
          USER_LAB_PASSWORD: ${{ secrets.USER_LAB_PASSWORD }}
          USER_FRONTDESK_PASSWORD: ${{ secrets.USER_FRONTDESK_PASSWORD }}
          USER_CLINICAL_READONLY_PASSWORD: ${{ secrets.USER_CLINICAL_READONLY_PASSWORD }}
          USER_PATIENT_READONLY_PASSWORD: ${{ secrets.USER_PATIENT_READONLY_PASSWORD }}
          USER_IPD_PASSWORD: ${{ secrets.USER_IPD_PASSWORD }}
        run: NODE_ENV=dev-lite npx playwright test --project=api --grep "@regression|@onlyLite" --grep-invert @onlyStandard --workers=5

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload test reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-regression-reports
          path: |
            reports/allure-report
            reports/html-report
            reports/test-results.json
            reports/allure-results
            test-results
          retention-days: 30
