name: UI Regression Tests

on:
  schedule:
    # 10:00 AM IST (Mon-Fri) — IST = UTC+5:30, so 04:30 UTC
    - cron: '30 4 * * 1-5'
  workflow_dispatch:

jobs:
  test:
    name: Run UI regression suite
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Check time
        run: date 
        
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run UI regression tests
        env:
          HEADLESS: true
          USER_ADMIN_PASSWORD: ${{ secrets.USER_ADMIN_PASSWORD }}
          USER_DOCTOR_PASSWORD: ${{ secrets.USER_DOCTOR_PASSWORD }}
          USER_NURSE_PASSWORD: ${{ secrets.USER_NURSE_PASSWORD }}
          USER_RECEPTIONIST_PASSWORD: ${{ secrets.USER_RECEPTIONIST_PASSWORD }}
          USER_LAB_PASSWORD: ${{ secrets.USER_LAB_PASSWORD }}
          USER_FRONTDESK_PASSWORD: ${{ secrets.USER_FRONTDESK_PASSWORD }}
          USER_CLINICAL_READONLY_PASSWORD: ${{ secrets.USER_CLINICAL_READONLY_PASSWORD }}
          USER_PATIENT_READONLY_PASSWORD: ${{ secrets.USER_PATIENT_READONLY_PASSWORD }}
          USER_IPD_PASSWORD: ${{ secrets.USER_IPD_PASSWORD }}
          RP_ENDPOINT: ${{ secrets.RP_ENDPOINT }}
          RP_API_KEY: ${{ secrets.RP_API_KEY }}
          RP_PROJECT: ${{ secrets.RP_PROJECT }}
          RP_LAUNCH: ui-regression
          RP_DESCRIPTION: "UI regression • branch=${{ github.ref_name }} • ${{ github.event_name }}"
          RP_ATTRIBUTES: "suite:ui-regression;env:dev-lite;branch:${{ github.ref_name }};commit:${{ github.sha }};runUrl:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: NODE_ENV=dev-lite npx playwright test --project=chromium --grep "@regression|@onlyLite" --grep-invert @onlyStandard

      - name: Upload test reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-reports
          path: |
            reports/html-report
            reports/test-results.json
            test-results
          retention-days: 30
